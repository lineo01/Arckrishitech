name: Refresh weekly Kalimati market snapshot
on:
  schedule:
    - cron: "30 1 * * 1" # Mondays 07:15 Nepal time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and validate weekly market table
        run: python scripts/update_market_snapshot.py
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market_snapshot.json frontend/market_snapshot.json
          git diff --cached --quiet || git commit -m "Refresh weekly Kalimati market snapshot"
          git push
